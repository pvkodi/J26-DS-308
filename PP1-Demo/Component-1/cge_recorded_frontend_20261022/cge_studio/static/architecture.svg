<g font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#0e1720"><text x="43" y="78">System instructions</text><text x="333" y="78">Obligation extractor</text><text x="633" y="78">Source-bound ledger</text><text x="43" y="225">Conversation state</text><text x="333" y="225">Shared predictor + profile</text><text x="633" y="225">Answer generation</text><text x="633" y="376">Detector + state tracker</text><text x="333" y="376">Versioned handoff</text><text x="43" y="376">Other CGE components</text></g>
<g font-family="Segoe UI, sans-serif" font-size="11.5" fill="#5a6874"><text x="43" y="102">Original governing policy</text><text x="333" y="102">Select sources · retain exact wording</text><text x="633" y="102">Rules · scope · checker · issues</text><text x="43" y="249">User message · history · native tokens</text><text x="43" y="265">Turns · load · prior passing answers</text><text x="333" y="249">Supported next first-failure risk</text><text x="333" y="265">Forecast committed before generation</text><text x="633" y="249">Local LLM or genuine recorded answer</text><text x="633" y="265">Origin and inference metadata retained</text><text x="633" y="400">Exact / semantic checks · evidence</text><text x="633" y="417">Violation · drift · recovery · unknown</text><text x="333" y="400">Ledger + risk + observed verdicts</text><text x="333" y="417">Actual current-session JSON</text><text x="43" y="400">Proposed interface only</text><text x="43" y="417">Not yet integrated</text><text x="26" y="481">Predictor scope:120-word limit and exact ending. Semantic detection is experimental and requires review.</text></g>
<g font-family="Segoe UI, sans-serif" font-size="10" fill="#8794a0"><text x="25" y="26" letter-spacing="1.5">CGE STUDIO / OBLIGATION MONITOR</text><text x="635" y="318">Actual answer + ledger + history</text></g>
