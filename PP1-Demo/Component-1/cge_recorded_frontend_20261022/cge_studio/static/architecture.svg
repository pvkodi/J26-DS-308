<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" role="img" aria-labelledby="title desc">
<title id="title">CGE obligation monitor architecture</title><desc id="desc">A system prompt is extracted to an obligation ledger. Conversation state and the ledger feed the shared predictor and optional target profile. Predictions are committed before a generator produces its answer. The detector checks that answer and exports verdicts and temporal events through a proposed handoff contract.</desc>
